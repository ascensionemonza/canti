<h2>
211.	Regina coeli<br>
</h2>
Regina coeli, laetare, alleluia. Quia quem meruisti portare, alleluia.<br>
Resurrexit, sicut dixit, alleluia. Ora pro nobis Deum, alleluia.<br>
<br>
