<h2>
71.	Davanti al Re<br>

</h2>
<ol>

<li>
Davanti al Re c’inchiniamo insieme<br>
per adorarlo con tutto il cuor.<br>
Verso di Lui eleviamo insieme<br>
canti di gloria al nostro Re dei re. (2v)<br>

<br>
</li>


</ol>
