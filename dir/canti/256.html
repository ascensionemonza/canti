<h2>
256.	Tota pulchra<br>
</h2>

Tota pulchra es, Maria et macula originalis non est in te.<br>
Tu gloria Ierusalem, tu laetitia Israel,
tu honorificentia populi nostri, tu advocata peccatorum.<br>
O Maria, O Maria, virgo prudentissima,<br>
mater clementissima, ora pro nobis,<br>
intercede pro nobis ad Dominum Iesum Christum.<br>
<br>
