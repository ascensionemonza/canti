<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Aggiorna Configurazione</title>
</head>
<body>

<h2>Aggiorna configurazione</h2>

<form id="formConfig">

    <!-- RIGA 1: DATA -->
    <div>
        <label>Data:</label><br>

        <select name="p1" id="giorno"></select>
        <select name="p2" id="mese">
            <option>gennaio</option>
            <option>febbraio</option>
            <option>marzo</option>
            <option>aprile</option>
            <option>maggio</option>
            <option>giugno</option>
            <option>luglio</option>
            <option>agosto</option>
            <option>settembre</option>
            <option>ottobre</option>
            <option>novembre</option>
            <option>dicembre</option>
        </select>
        <select name="p3" id="anno"></select>

        <button type="button" id="btnDomenica">Domenica prossima</button>
    </div>

    <br>

    <!-- RIGA 2: ORA -->
    <div>
        <label>Ora:</label><br>

        <select name="p4" id="ora"></select>
        <select name="p5" id="minuti">
            <option>00</option>
            <option>05</option>
            <option>10</option>
            <option>15</option>
            <option>20</option>
            <option>25</option>
            <option>30</option>
            <option>35</option>
            <option>40</option>
            <option>45</option>
            <option>50</option>
            <option>55</option>
        </select>
    </div>

    <br>

    <!-- RIGA 3: TESTO LIBERO -->
    <div>
        <label>Canti:</label><br>
        <input type="text" name="p6" id="testo" style="width:600px;">
    </div>

    <br>

    <!-- RIGA 4: TESTO LIBERO -->
    <div>
        <label>Salmo:</label><br>
        <textarea name="p7" id="salmo" rows="20" cols="80"></textarea>

    </div>

    <br>

    <button type="submit">Salva</button>
</form>

<p id="risposta"></p>

<script>
// --- Calcolo domenica prossima ---
function prossimaDomenica() {
    const oggi = new Date();
    const giornoSettimana = oggi.getDay(); // 0=dom, 1=lun...
    const giorniMancanti = (7 - giornoSettimana) % 7 || 7;
    const domenica = new Date(oggi);
    domenica.setDate(oggi.getDate() + giorniMancanti);
    return domenica;
}

// --- Popola GIORNO 1–31 ---
const giornoSel = document.getElementById("giorno");
for (let i = 1; i <= 31; i++) {
    giornoSel.innerHTML += `<option value="${i}">${i}</option>`;
}

// --- Popola ANNO: quest’anno → prossimo anno ---
const annoSel = document.getElementById("anno");
const oggi = new Date();
const annoCorrente = oggi.getFullYear();
const annoProssimo = annoCorrente + 1;

for (let y = annoCorrente; y <= annoProssimo; y++) {
    annoSel.innerHTML += `<option value="${y}">${y}</option>`;
}

// --- Popola ORE 0–24 ---
const oraSel = document.getElementById("ora");
for (let h = 0; h <= 24; h++) {
    oraSel.innerHTML += `<option value="${h}">${h}</option>`;
}

// --- Imposta default richiesti ---
function impostaDefault() {
    giornoSel.value = 1;
    document.getElementById("mese").value = "gennaio";
    annoSel.value = annoCorrente;

    // ORA DEFAULT (stringa!)
    oraSel.value = "10";

    // MINUTI DEFAULT
    document.getElementById("minuti").value = "00";
}

// --- Pulsante: imposta domenica prossima ---
document.getElementById("btnDomenica").addEventListener("click", () => {
    const d = prossimaDomenica();

    // DATA
    giornoSel.value = d.getDate();
    document.getElementById("mese").selectedIndex = d.getMonth();
    annoSel.value = d.getFullYear();

    // ORA (correzione richiesta)
    oraSel.value = "10";
    document.getElementById("minuti").value = "00";
});

// --- Pre-compilazione da file + default se non esiste ---
async function precompila() {
    const res = await fetch('../leggi.php');
    const data = await res.json();

    if (!data.esiste) {
        impostaDefault();
        return;
    }

    const riga1 = data.riga1.trim();
    const riga2 = data.riga2.trim();
    const altreRighe = (data.altreRighe || "").trim();

    // Esempio riga1:
    // "23 agosto 2026 ore 10"
    // "23 agosto 2026 ore 10:45"

    // --- PARSING RIGA 1 ---
    const parti = riga1.split(" ");

    const giorno = parti[0];          // "23"
    const mese = parti[1];            // "agosto"
    const anno = parti[2];            // "2026"

    // "ore" è parti[3]
    const oraMinuti = parti[4];       // "10" oppure "10:45"

    let ora = "10";
    let minuti = "00";

    if (oraMinuti.includes(":")) {
        const [h, m] = oraMinuti.split(":");
        ora = h;
        minuti = m;
    } else {
        ora = oraMinuti;
        minuti = "00";
    }

    // --- Imposta valori nelle combo ---
    giornoSel.value = giorno;
    document.getElementById("mese").value = mese;   
    annoSel.value = anno;

    oraSel.value = ora;
    document.getElementById("minuti").value = minuti;

    // --- Testo libero ---
    document.getElementById("testo").value = riga2;

    document.getElementById("salmo").value = altreRighe;
}

precompila();

// --- Invio form ---
document.getElementById("formConfig").addEventListener("submit", async (e) => {
    e.preventDefault();

    const dati = {
        p1: e.target.p1.value,
        p2: e.target.p2.value,
        p3: e.target.p3.value,
        p4: e.target.p4.value,
        p5: e.target.p5.value,
        p6: e.target.p6.value,
        p7: e.target.p7.value
    };

    const res = await fetch("../salva.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dati)
    });

    const json = await res.json();
    document.getElementById("risposta").innerText = JSON.stringify(json, null, 2);
});
</script>

</body>
</html>
