<h2>
247.	Ti amo Signor<br>
</h2>

Ti amo Signor, a Te elevo la voce per adorarti con tutta l'anima mia.<br>
<br>
Gioisci mio Re, si rallegri il mio cuor, dolce Signor e divin Redentor.<br>
