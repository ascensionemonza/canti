<h2>10.	Alleluia: canto per Cristo</h2>
<ol>
<li>
Canto per Cristo che mi libererà quando verrà nella gloria:<br>
quando la vita con Lui rinascerà, alleluia, alleluia...
</li><br>
<li>
Canto per Cristo che un giorno tornerà festa per tutti gli amici,<br>
festa di un mondo che più non morirà, alleluia, alleluia...
</li>
</ol><br><br>
