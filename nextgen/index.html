#controlloTesto {

<center>
  <span style="color:#BF8F00">
    <h2>Chiesa San Biagio<br>Monza</h2>
  </span>

  <div id="data_e_ora"></div>
  <div class="button-grid" id="programma"></div>
  <div id="contenuto"></div>

<script>

// Carica config.txt SENZA controllo data
fetch("/cantiSB/config/config.txt?nocache=" + Date.now())
  .then(response => response.text())
  .then(text => {
    const config = text.split(/\r?\n/);
    caricaconst(config);
  });

function caricaconst(config) {
  fetch("/cantiSB/costanti.txt")
    .then(response => response.text())
    .then(text => {
      const costanti = text.split(/\r?\n/);
      leggi_canti(costanti, config);
    });
}

function leggi_canti(costanti, config) {
  fetch("/cantiSB/numericanti.txt")
    .then(response => response.text())
    .then(text => {
      const titolicanti = text.split(/\r?\n/);
      leggi_aggiunte(costanti, config, titolicanti);
    });
}

function leggi_aggiunte(costanti, config, titolicanti) {
  fetch("/cantiSB/numeriaggiunte.txt")
    .then(response => response.text())
    .then(text => {
      const titoliaggiunte = text.split(/\r?\n/);
      crea_programma(costanti, config, titolicanti, titoliaggiunte);
    });
}

function crea_programma(costanti, config, titolicanti, titoliaggiunte) {

  document.getElementById("data_e_ora").innerHTML =
    "<h3>Programma del<br>" + config[0] + "</h3>";

  const canti_liturgia = config[1];
  const liturgie = costanti[0].split(',');
  let html = "";

  const mioArray = canti_liturgia.split(';');

  for (let i = 0; i < 24; i++) {

    if (mioArray[i] != "0") {

      if (mioArray[i].substring(0,3) == "149") mioArray[i] = "149";
      if (mioArray[i].substring(0,3) == "163") mioArray[i] = "163";

      if (mioArray[i].length < 4) {

        if (mioArray[i].charAt(0) == "A") {
          html += "<a href=\"liturgia.html?n=" + i + "\">" +
                  liturgie[i] + ": " +
                  titoliaggiunte[mioArray[i].substring(1) - 1] +
                  " (" + mioArray[i] + ")</a>";
        } else {
          html += "<a href=\"liturgia.html?n=" + i + "\">" +
                  liturgie[i] + ": " +
                  titolicanti[mioArray[i] - 1] +
                  " (" + mioArray[i] + ")</a>";
        }
      }
    }
  }

  html += "<center><img src=/cantiSB/NextGen.png style=\"height:100px\"></center>";
  document.getElementById("programma").innerHTML = html;
}

</script>
