<script>

function codice(numero) {

    if (!numero) return null;

    numero = numero.toUpperCase();

    let iniziale = numero.charAt(0);
    if (/^[A-Z]/.test(iniziale)) {
        return numero.charAt(0) + numero.substring(1).padStart(2,"0");
    }

    return numero.padStart(3,"0");
}

async function carica(file, div, liturgia) {

    var testocanto = "";
    const risposta = await fetch(file);
    if (risposta.status == 404) testocanto += "File " + file + " non trovato<br><br>"
    else {
      testocanto = await risposta.text();
    }
    if (liturgia.length > 0)
      div.innerHTML += "<hr><h2><span style=\"color:#BF8F00\"><center>" + liturgia + "</center></span></h2><hr>";
    div.innerHTML += testocanto;

    attivaVoci();
}

function attivaVoci() {

    const sezioni = ["soprani","contralti","tenori","bassi"];
    const presenti = sezioni.filter(id => document.getElementById(id));

    if (presenti.length === 0) return;

    presenti.forEach(id => {
        document.getElementById(id).style.display = "none";
    });

    const voceSalvata = localStorage.getItem("vocePreferita") || presenti[0];
    document.getElementById(voceSalvata).style.display = "block";

    document.querySelectorAll(".voceBox a").forEach(btn => {
        btn.classList.remove("attivo");
    });

    const btnAttivo = document.querySelector(`.voceBox a[data-voce="${voceSalvata}"]`);
    if (btnAttivo) btnAttivo.classList.add("attivo");
}

function selezionaVoce(voce) {
    localStorage.setItem("vocePreferita", voce);

    ["soprani","contralti","tenori","bassi"].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.style.display = "none";
    });

    const el = document.getElementById(voce);
    if (el) el.style.display = "block";

    document.querySelectorAll(".voceBox a").forEach(btn => {
        btn.classList.remove("attivo");
    });

    const btnAttivo = document.querySelector(`.voceBox a[data-voce="${voce}"]`);
    if (btnAttivo) btnAttivo.classList.add("attivo");
}

async function crea_programma(costanti, config) {
  if (config[0] != "") {
    const canti_liturgia = config[1];
    const liturgie = costanti[0].split(',');
    const div = document.getElementById("programma");
    var filecanto = "";
    var testocanto = "";

    div.innerHTML = "<h3><b><center>Programma del " + config[0] + "</center></b></h3>";

    mioArray = canti_liturgia.split(';')
    for (let i=0 ; i<24 ; i++) {
      if ( i== 6 ) { // salmo
        let j = 2;
        let ritornello = "<br><b>" + config[j].substring(3) + "</b><br>";
        if (config[j].length > 0) {
          div.innerHTML += "<hr><h2><span style=\"color:#BF8F00\"><center>" + liturgie[i] + "</center></span></h2><hr>";
          div.innerHTML += ritornello;
          j += 1;
        }
        while (j < config.length) {
          if ( config[j].substring(config[j].length - 4) == ". R.") 
            div.innerHTML += config[j].substring(0, config[j].length - 3) + "<br>" + ritornello;  
          else  
            div.innerHTML += config[j] + "<br>";
          j += 1;
        }
        if ( j > 2) div.innerHTML += "<br>";
      }
      if ( i == 14 ) {
          div.innerHTML += "<hr><h2><span style=\"color:#BF8F00\"><center>Dopo la consacrazione</center></span></h2><hr>";
          div.innerHTML += "<br><i>Mistero della fede.</i><br><br><b>Annunciamo la tua morte, Signore,<br>proclamiamo la tua resurrezione<br>nell'attesa della tua venuta.</b><br><br>";
      }
      if (mioArray[i] != "0") {
        if (mioArray[i].substring(0,4) == "163.") {
          filecanto = "canti/" + mioArray[i].substring(0,3) + ".0.html";
          await carica(filecanto, div, liturgie[i]);
          for (let j = 4 ; j < mioArray[i].length ; j++) {
            filecanto = "canti/" + mioArray[i].substring(0,3) + "." + mioArray[i].charAt(j) + ".html";
            await carica(filecanto, div, "");
          } 
        } else {
          filecanto = "canti/" + codice(mioArray[i]) + ".html";
          await carica(filecanto, div, liturgie[i])
        }
      }
    }
  }
}

function caricaconfig(costanti) {
  fetch("../config/config.txt")
  .then(response => response.text())
  .then(text => {
    const config = text.split(/\r?\n/);
    crea_programma(costanti, config);
  })
}

function caricaconst() {
  fetch("../costanti.txt")
  .then(response => response.text())
  .then(text => {
    const costanti = text.split(/\r?\n/);
    caricaconfig(costanti);
  })
}

caricaconst();
