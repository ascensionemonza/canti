<h2>15.	Alleluia: ed oggi ancora</h2>
<b>Alleluia, alleluia...</b><br><br>
Ed oggi ancora, mio Signore ascolterò la tua Parola <br>
che mi guida nel cammino della vita.<br><br>
<b>Alleluia, alleluia...</b>
