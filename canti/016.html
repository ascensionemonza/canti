<h2>16.	Alleluia: la nostra festa</h2>
<b>Alleluia, alleluia...</b><br><br>
La nostra festa non deve finire non deve finire e non finirà. (2v)<br>
Perché la festa siamo noi che camminiamo verso Te<br>
perché la festa siamo noi cantando insieme così. 
<br><br>
<b>Alleluia, alleluia...</b>
