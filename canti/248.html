<h2>
248.	Ti chiedo perdono<br>

</h2>
Ti chiedo perdono Padre buono per ogni mancanza d’amore,<br>
per la mia debole speranza e per la mia fragile fede.<br>
<b><br>
Domando a Te Signore, che illumini i miei passi,<br>
la forza di vivere con tutti i miei fratelli<br>
nuovamente fedele al tuo Vangelo.<br>

</b>
