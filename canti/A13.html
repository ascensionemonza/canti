<h2>
A13. Jesu, Rex admirabilis
</h2>
<ol>
<li>
    Jesu, Rex admirabilis et triumphator nobilis<br>
    dulcedo ineffabilis totus desiderabilis.<br>
</li><br><li>
    Mane nobiscum Domine et nos illustra lumine<br>
	pulsa mentis caligine mundum reple dulcedine.
</li>

</ol>
