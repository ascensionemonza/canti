<h2>5.	Accoglimi</h2>
<ol>
<li>
Accoglimi, Signore, secondo la tua Parola. (2v)<br>
Ed io lo so che Tu Signore in ogni tempo sarai con me. (2v)
<br><br></li>
<li>
Ti seguirò, Signore, secondo la tua Parola. (2v)<br>
Ed io lo so che in Te Signore la mia speranza si compirà. (2v) Amen.
</li>
</ol>
