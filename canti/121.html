<h2>
121.	Il canto della tenerezza<br>

</h2>
<ol>

<li>
Accanto a me, dolce Signore, nel tempo nuovo camminerai.<br>
E dentro me, dono di gioia, un canto eterno risuonerà.<br>

<br>
</li>

<li>
Accanto a Te, umile Figlio, l’amore vero conoscerò.<br>
E insieme a Te, con la mia vita, al mio fratello risponderò.<br>

<br>
</li>



</ol>
