<h2>
46.	Canto la tua gloria</h2>

Canto la tua gloria, Dio della vita: cantano i secoli per Te.<br>
Canto la tua gloria, Dio dell’amore: Signore della verità.<br>
Mai cesserò di cantare per Te!<br>
E canterò la tua bontà, la tua pazienza di Padre<br>
che vede e comprende e la tua forza che mi sostiene. <b>Alleluia (4v)</b>
